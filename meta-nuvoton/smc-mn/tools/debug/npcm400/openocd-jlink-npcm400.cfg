# J-Link + OpenOCD template for NPCM400 bring-up/debug.
#
# Usage:
#   openocd -f tools/debug/npcm400/openocd-jlink-npcm400.cfg
#
# Optional overrides:
#   -c "set TRANSPORT jtag"
#   -c "set ADAPTER_KHZ 4000"
#   -c "set TARGET_CFG target/cortex_m.cfg"
#
# Note:
#   Replace TARGET_CFG with an NPCM400-specific target cfg when available.
#   Generic cortex_m cfg is only a fallback for early bring-up.

if {![info exists TRANSPORT]} {
    set TRANSPORT jtag
}

if {![info exists ADAPTER_KHZ]} {
    set ADAPTER_KHZ 500
}

if {![info exists TARGET_CFG]} {
    set TARGET_CFG target-generic-cortexm.cfg
}

if {![info exists RESET_CONFIG]} {
    set RESET_CONFIG none
}

source [find interface/jlink.cfg]
transport select $TRANSPORT
adapter speed $ADAPTER_KHZ

if {[file exists $TARGET_CFG]} {
    source $TARGET_CFG
} else {
    source [find $TARGET_CFG]
}

# Default to a reset mode that does not require SRST wiring.
# Override example:
#   -c "set RESET_CONFIG {srst_only srst_nogate connect_assert_srst}"
eval reset_config $RESET_CONFIG

init
targets
