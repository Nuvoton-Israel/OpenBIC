# Generic Cortex-M target template for early attach/halt bring-up.
#
# Optional variables (set via -c):
#   CHIPNAME     default: npcm400
#   CPUDAPID     expected SW-DP ID (optional; omit to skip strict match)
#   WORKAREASIZE default: 0x2000

source [find target/swj-dp.tcl]

if { [info exists CHIPNAME] } {
    set _CHIPNAME $CHIPNAME
} else {
    set _CHIPNAME npcm400
}

if { [info exists WORKAREASIZE] } {
    set _WORKAREASIZE $WORKAREASIZE
} else {
    set _WORKAREASIZE 0x2000
}

# Allow operation without a strict DAP ID for early board bring-up.
if { [info exists CPUDAPID] } {
    swj_newdap $_CHIPNAME cpu -irlen 4 -expected-id $CPUDAPID
} else {
    swj_newdap $_CHIPNAME cpu -irlen 4
}

dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu
set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME cortex_m -dap $_CHIPNAME.dap

# RAM work area; tune if needed for your SoC memory map.
$_TARGETNAME configure -work-area-phys 0x20000000 -work-area-size $_WORKAREASIZE -work-area-backup 0

# Use SYSRESETREQ when SRST is not reliable/connected.
cortex_m reset_config sysresetreq
